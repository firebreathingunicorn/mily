name: MilyApp
options:
  bundleIdPrefix: com.mily
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MilyCore:
    path: ..
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.0.0

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  MilyApp:
    type: application
    platform: iOS
    sources:
      - path: MilyApp
      - path: Resources
    dependencies:
      - package: MilyCore
        product: MilyCore
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mily.app
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: MilyApp/Support/Info.plist
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MilyAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: MilyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mily.app.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: MilyApp

schemes:
  MilyApp:
    build:
      targets:
        MilyApp: all
    run:
      config: Release
      storeKitConfiguration: Resources/mily.storekit
    test:
      config: Debug
      targets:
        - MilyAppUITests
